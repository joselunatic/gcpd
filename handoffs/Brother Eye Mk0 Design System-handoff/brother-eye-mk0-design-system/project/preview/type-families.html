<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bem-bg-void);color:var(--bem-phosphor-text);
    font-family:var(--bem-font-mono);padding:22px 28px;
    display:flex;flex-direction:column;gap:16px}
  .block{display:flex;flex-direction:column;gap:6px}
  .tag{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bem-phosphor-mute)}
  .mono{font-family:var(--bem-font-mono);font-size:.95rem;color:var(--bem-phosphor-text)}
  .out{font-family:var(--bem-font-output);font-size:.95rem;color:var(--bem-phosphor-bright)}
  .read{font-family:var(--bem-font-readout);font-size:1.5rem;letter-spacing:.04em;color:var(--bem-phosphor)}
</style>
</head>
<body>
  <div class="block"><span class="tag">Mono · Share Tech Mono — workhorse</span>
    <span class="mono">CASE #079-A · KNIGHTFALL-C · STATUS: ACTIVE</span></div>
  <div class="block"><span class="tag">Output · Monofonto — transcript / command</span>
    <span class="out">&gt; SYSLOG: BATSIGNAL OFFLINE | ORACLE RELAY: STANDBY</span></div>
  <div class="block"><span class="tag">Readout · VT323 — heavy phosphor display</span>
    <span class="read">SYNC: LIVE  ::  03 AGENTS</span></div>
</body>
</html>
