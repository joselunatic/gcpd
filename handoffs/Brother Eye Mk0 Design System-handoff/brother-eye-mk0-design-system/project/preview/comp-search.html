<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bem-bg-void);color:var(--bem-phosphor-text);
    font-family:var(--bem-font-mono);padding:22px 24px}
  .panel{background:var(--bem-bg-surface);border:1px solid var(--bem-border-strong);border-radius:var(--bem-radius-lg);overflow:hidden}
  .hd{padding:.9rem 1rem;border-bottom:1px solid var(--bem-border-faint)}
  .input{width:100%;box-sizing:border-box;padding:.7rem .8rem;border:1px solid rgba(45,220,147,.2);
    background:rgba(3,12,16,.5);color:var(--bem-phosphor-text);border-radius:var(--bem-radius-md);font-family:inherit;font-size:.9rem}
  .hint{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(180,255,228,.5);margin-top:.5rem}
  .row{display:flex;align-items:center;gap:.8rem;padding:.7rem 1rem;border-bottom:1px solid rgba(45,220,147,.08)}
  .row.active{background:rgba(45,220,147,.12)}
  .icon{width:24px;text-align:center;font-size:1.05rem}
  .col{flex:1;min-width:0}
  .lab{font-size:.9rem;color:#defff3}
  .sub{font-size:.72rem;color:rgba(180,255,228,.6)}
  .badge{font-size:.62rem;padding:.25rem .5rem;background:rgba(45,220,147,.2);color:rgba(180,255,228,.8);
    border-radius:var(--bem-radius-sm);text-transform:uppercase;letter-spacing:.03em}
</style>
</head>
<body>
  <div class="panel">
    <div class="hd"><input class="input" value="joker"><div class="hint">↑↓ navegar · ↵ abrir · esc cerrar</div></div>
    <div class="row active"><span class="icon">🎭</span><div class="col"><div class="lab">El Joker</div><div class="sub">Villano · Amenaza: Extrema</div></div><span class="badge">Villano</span></div>
    <div class="row"><span class="icon">📋</span><div class="col"><div class="lab">El Hombre Que Ríe</div><div class="sub">Caso · #079-A</div></div><span class="badge">Caso</span></div>
    <div class="row"><span class="icon">📍</span><div class="col"><div class="lab">Ace Chemical</div><div class="sub">POI · Distrito Este</div></div><span class="badge">POI</span></div>
  </div>
</body>
</html>
