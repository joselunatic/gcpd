<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bem-bg-void);color:var(--bem-phosphor-text);
    font-family:var(--bem-font-mono);padding:26px 28px;
    display:flex;flex-direction:column;gap:14px}
  .banner{font-family:var(--bem-font-display);font-size:2.1rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--bem-phosphor-bright);line-height:1}
  .sub{font-family:var(--bem-font-display);font-size:1.2rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--bem-phosphor-text)}
  .row{display:flex;justify-content:space-between;align-items:baseline;
    font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bem-phosphor-mute)}
</style>
</head>
<body>
  <div class="row"><span>Display · WOPR</span><span>--bem-font-display</span></div>
  <div class="banner">Brother Eye Mk0</div>
  <div class="sub">GCPD / Wayne Aux Node</div>
</body>
</html>
