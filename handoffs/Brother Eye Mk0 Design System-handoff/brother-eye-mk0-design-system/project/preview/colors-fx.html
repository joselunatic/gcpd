<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{background:var(--bem-bg-void);color:var(--bem-phosphor-text);
    font-family:var(--bem-font-mono);padding:22px 24px;display:flex;flex-direction:column;gap:11px}
  .hd{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bem-phosphor-mute)}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .fx{padding:8px 14px;border-radius:var(--bem-radius-sm);border:1px solid;background:transparent;
    font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
  .alarm{border-color:rgba(255,80,80,.55);color:#ffb0b0}
  .critical{border-color:rgba(255,40,40,.7);color:#ff8080;background:rgba(180,0,0,.08)}
  .hack{border-color:rgba(0,200,130,.5);color:#7dffcf}
  .fog{border-color:rgba(90,160,200,.45);color:#a8d8f0}
  .flicker{border-color:rgba(200,180,100,.45);color:#ffe99a}
  .media{border-color:rgba(140,180,255,.5);color:#c0d8ff}
</style>
</head>
<body>
  <div class="hd">RT-Effects category accents — muted families on the ops board</div>
  <div class="row">
    <span class="fx alarm">Alarm</span>
    <span class="fx critical">Critical</span>
    <span class="fx hack">Hack</span>
    <span class="fx fog">Fog</span>
    <span class="fx flicker">Flicker</span>
    <span class="fx media">Media</span>
  </div>
</body>
</html>
